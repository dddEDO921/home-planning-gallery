<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LDKの昼と夜の写真を表示します。">
  <meta name="theme-color" content="#f6f3ed">
  <title>LDKの昼と夜 | 2階LDK</title>
  <link rel="stylesheet" href="site.css?v=variations1">
  <script src="gallery.js" defer></script>
</head>
<body>
  <header class="intro">
    <h1>LDKの昼と夜</h1>
    <p class="picker-links"><a href="variations.html">写真でバリエーションを選ぶ</a><a href="index.html">LDKの全景・各部屋</a></p>
  </header>
  <main>
<section id="evening" aria-label="昼夜の比較写真">

<p>夜は温白色（3500 K）のダウンライト・スポットライトと、3000 Kのペンダントを点灯したイメージです。</p>
<div class="cards">
<a class="card" href="images/evening/interior.webp" data-photo="昼と夜を同じ画角で比較"><img src="images/evening/interior-small.webp" width="640" height="464" style="aspect-ratio:auto" alt="昼と夜を同じ画角で比較" loading="lazy" decoding="async"><span>昼と夜を同じ画角で比較</span></a>
<a class="card" href="images/evening/living-to-kitchen.webp" data-photo="夜のダイニングとキッチン"><img src="images/evening/living-to-kitchen-small.webp" width="640" height="420" style="aspect-ratio:auto" alt="夜のダイニングとキッチン" loading="lazy" decoding="async"><span>夜のダイニングとキッチン</span></a>
<a class="card" href="images/evening/kitchen-to-living.webp" data-photo="夜のリビング"><img src="images/evening/kitchen-to-living-small.webp" width="640" height="420" style="aspect-ratio:auto" alt="夜のリビング" loading="lazy" decoding="async"><span>夜のリビング</span></a>
</div>
</section>
  </main>

  <dialog aria-labelledby="photo-title">
    <div class="lightbox-top">
      <h2 id="photo-title"></h2>
      <button type="button" id="close" aria-label="画像を閉じる" autofocus>閉じる</button>
    </div>
    <img id="large" alt="">
    <div class="lightbox-controls">
      <button type="button" id="prev" aria-label="前の画像">‹ 前へ</button>
      <output id="counter" aria-live="polite"></output>
      <button type="button" id="next" aria-label="次の画像">次へ ›</button>
    </div>
  </dialog>
</body>
</html>
