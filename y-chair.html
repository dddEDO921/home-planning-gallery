<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Yチェアのあるダイニングを7つの視点から見る写真風ギャラリー。">
  <meta name="theme-color" content="#f6f3ed">
  <title>Yチェアのあるダイニング | 2階LDK フォトギャラリー</title>
  <link rel="stylesheet" href="site.css?v=lighting1">
  <script src="gallery.js" defer></script>
  <script src="lighting.js" defer></script>
</head>
<body>
  <header class="intro">
    <h1>Yチェアのあるダイニング</h1>
    <p class="picker-links"><a href="variations.html">写真でバリエーションを選ぶ</a><a href="index.html">LDKの全景・各部屋</a></p>
  <div class="lighting-switch" role="group" aria-label="照明" data-lighting hidden><span>照明</span><button type="button" value="day" aria-pressed="false">昼の自然光</button><button type="button" value="night" aria-pressed="true">夜の温白色</button></div></header>
  <main>
    <div class="cards">
      <a id="dining-table" class="card" href="images/y-chair/dining-table.webp" data-photo="テーブルとペンダント、Yチェア">
          <img src="images/y-chair/dining-table-small.webp" srcset="images/y-chair/dining-table-small.webp 640w, images/y-chair/dining-table.webp 1440w" sizes="(max-width: 560px) calc(100vw - 32px), (max-width: 1140px) (max-width: 850px) 47vw, 344px" width="640" height="420" alt="テーブルとペンダント、Yチェア" loading="lazy" decoding="async">
          <span>テーブルとペンダント</span>
        </a>
      <a id="living-to-kitchen" class="card" href="images/y-chair/living.webp" data-photo="リビングからキッチン、Yチェア">
          <img src="images/y-chair/living-small.webp" srcset="images/y-chair/living-small.webp 640w, images/y-chair/living.webp 1440w" sizes="(max-width: 560px) calc(100vw - 32px), (max-width: 1140px) (max-width: 850px) 47vw, 344px" width="640" height="420" alt="リビングからキッチン、Yチェア" loading="lazy" decoding="async">
          <span>リビングからキッチン</span>
        </a>
      <a id="dining-windows" class="card" href="images/y-chair/dining-windows.webp" data-photo="ダイニングの高窓、Yチェア">
          <img src="images/y-chair/dining-windows-small.webp" srcset="images/y-chair/dining-windows-small.webp 640w, images/y-chair/dining-windows.webp 1440w" sizes="(max-width: 560px) calc(100vw - 32px), (max-width: 1140px) (max-width: 850px) 47vw, 344px" width="640" height="420" alt="ダイニングの高窓、Yチェア" loading="lazy" decoding="async">
          <span>ダイニングの高窓</span>
        </a>
      <a id="kitchen-to-living" class="card" href="images/y-chair/dining-reverse.webp" data-photo="キッチン側からリビング、Yチェア">
          <img src="images/y-chair/dining-reverse-small.webp" srcset="images/y-chair/dining-reverse-small.webp 640w, images/y-chair/dining-reverse.webp 1440w" sizes="(max-width: 560px) calc(100vw - 32px), (max-width: 1140px) (max-width: 850px) 47vw, 344px" width="640" height="420" alt="キッチン側からリビング、Yチェア" loading="lazy" decoding="async">
          <span>キッチン側からリビング</span>
        </a>
      <a id="sink-to-dining" class="card" href="images/y-chair/from-sink.webp" data-photo="シンク前からダイニング、Yチェア">
          <img src="images/y-chair/from-sink-small.webp" srcset="images/y-chair/from-sink-small.webp 640w, images/y-chair/from-sink.webp 1440w" sizes="(max-width: 560px) calc(100vw - 32px), (max-width: 1140px) (max-width: 850px) 47vw, 344px" width="640" height="420" alt="シンク前からダイニング、Yチェア" loading="lazy" decoding="async">
          <span>シンク前からダイニング</span>
        </a>
      <a id="dining-sideboard" class="card" href="images/y-chair/dining-stairwall.webp" data-photo="サイドボードと階段、Yチェア">
          <img src="images/y-chair/dining-stairwall-small.webp" srcset="images/y-chair/dining-stairwall-small.webp 640w, images/y-chair/dining-stairwall.webp 1440w" sizes="(max-width: 560px) calc(100vw - 32px), (max-width: 1140px) (max-width: 850px) 47vw, 344px" width="640" height="420" alt="サイドボードと階段、Yチェア" loading="lazy" decoding="async">
          <span>サイドボードと階段</span>
        </a>
      <a id="ldk-overview" class="card" href="images/y-chair/overview.webp" data-photo="2階LDKの全体俯瞰、Yチェア">
          <img src="images/y-chair/overview-small.webp" srcset="images/y-chair/overview-small.webp 640w, images/y-chair/overview.webp 1440w" sizes="(max-width: 560px) calc(100vw - 32px), (max-width: 1140px) (max-width: 850px) 47vw, 344px" width="640" height="420" alt="2階LDKの全体俯瞰、Yチェア" loading="lazy" decoding="async">
          <span>2階LDKの全体俯瞰</span>
        </a>
    </div>
  </main>
  <footer>写真風イメージです。木の色や椅子の細部は製品資料をもとにした近似です。</footer>
  <dialog aria-labelledby="photo-title">
    <div class="lightbox-top">
      <h2 id="photo-title"></h2>
      <button type="button" id="close" aria-label="画像を閉じる" autofocus>閉じる</button>
    </div>
    <img id="large" alt="">
    <div class="lightbox-controls">
      <button type="button" id="prev" aria-label="前の画像">‹ 前へ</button>
      <output id="counter" aria-live="polite"></output>
      <button type="button" id="next" aria-label="次の画像">次へ ›</button>
    </div>
  </dialog>
</body>
</html>
